aid: confide
name: Confide *
description: 'Confide is a confidential messaging application that lets people communicate
  digitally with the same level of privacy and security as the spoken word. Messages are
  end-to-end encrypted, ephemeral (they disappear after being read), and screenshot-protected
  so recipients cannot capture or forward them. Available on iPhone, iPad, Android, Mac, and
  Windows across 200+ countries and 15 languages, with a free tier for individuals and small
  groups and a Confide Plus subscription that unlocks unlimited attachments, message retraction,
  incognito mode, nicknames, and themes. Confide is a consumer product and does not currently
  publish a public developer API, SDK, or developer portal; this profile is maintained as a
  company record backed by GV in the API Evangelist network.'
